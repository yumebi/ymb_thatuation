name: Check Inno Setup 7

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC) に実行
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Inno Setup latest version
        id: inno
        shell: pwsh
        run: |
          function Set-Output([string]$Name, $Value) {
            $text = ([string]$Value).Replace("`r", ' ').Replace("`n", ' ')
            "$Name=$text" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          $out = choco search innosetup --exact --limitoutput 2>$null
          $match = [regex]::Match(($out -join ' '), '^innosetup\|(\d+)\.(\d+)\.(\d+)$', 'IgnoreCase')
          if (-not $match.Success) {
            Write-Host "::error::choco の出力を解釈できません: $out"
            exit 1
          }
          $major = $match.Groups[1].Value
          $version = "$($match.Groups[1].Value).$($match.Groups[2].Value).$($match.Groups[3].Value)"
          Set-Output 'major' $major
          Set-Output 'version' $version
          Write-Host "choco innosetup $version"

      - name: Check Inno Setup version on the runner image
        id: runner
        shell: pwsh
        run: |
          function Set-Output([string]$Name, $Value) {
            $text = ([string]$Value).Replace("`r", ' ').Replace("`n", ' ')
            "$Name=$text" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          # windows-latest が指すイメージ(2025 系)の Readme に載っている版を読む
          $names = 'Windows2025-VS2026-Readme.md', 'Windows2025-Readme.md'
          $major = 0
          $version = 'unknown'
          foreach ($name in $names) {
            $url = "https://raw.githubusercontent.com/actions/runner-images/main/images/windows/$name"
            try {
              $text = Invoke-RestMethod -Uri $url
            } catch {
              Write-Host "::error::$name の取得に失敗しました: $($_.Exception.Message)"
              exit 1
            }
            $m = [regex]::Match($text, 'InnoSetup\s+(\d+)\.(\d+)\.(\d+)')
            if ($m.Success) {
              $v = "$($m.Groups[1].Value).$($m.Groups[2].Value).$($m.Groups[3].Value)"
              Write-Host "$name : InnoSetup $v"
              if ([int]$m.Groups[1].Value -ge $major) {
                $major = [int]$m.Groups[1].Value
                $version = $v
              }
            } else {
              Write-Host "::warning::$name に InnoSetup の記載が見つかりません"
            }
          }
          Set-Output 'major' $major
          Set-Output 'version' $version

      - name: Create issue if Inno Setup 7 is available
        if: fromJSON(steps.inno.outputs.major) >= 7 || fromJSON(steps.runner.outputs.major) >= 7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $title = 'Inno Setup 7 が利用可能になりました'
          $open = gh issue list --search "$title in:title" --state open --json number --jq 'length'
          if ($open -gt 0) {
            Write-Output "既にオープンのIssueがあるためスキップします"
          } else {
            $version = "${{ steps.inno.outputs.version }}"
            $runner = "${{ steps.runner.outputs.version }}"
            $body = @(
              "choco の innosetup パッケージが Inno Setup 7 に更新され、GitHub Actions ランナーで利用可能になりました。"
              "- choco パッケージバージョン: $version"
              "- ランナーイメージの Inno Setup: $runner"
              "- 対応内容: 各リポジトリの release.yml の Inno Setup 呼び出しパスを 7 用に更新する"
              '  （例: "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -> "C:\Program Files\Inno Setup 7\ISCC.exe"）'
              "この Issue のクローズをもって対応完了とします。"
            ) -join "`n"
            gh issue create --title $title --body $body
          }
